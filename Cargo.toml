[package]
name = "codexctl"
version = "0.1.0"
edition = "2024"
description = "Thin shell-native controller for Codex App Server: start, steer, interrupt, goal, tail."
license = "MIT"
repository = "https://github.com/voltropy/codexctl"

[[bin]]
name = "codexctl"
path = "src/main.rs"

[dependencies]
codex-app-server-sdk = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
nix = { version = "0.29", features = ["signal"] }
fs2 = "0.4"
